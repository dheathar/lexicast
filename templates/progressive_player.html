<!doctype html>
<!-- Progressive (streaming) player for a running lexicast job (2026-09-05).
     Served by webapp.py's /progressive/<job_id> route with %%JOB_ID%% and
     %%TITLE%% replaced. Polls /manifest, fetches each finished block wav from
     /block, and plays them back-to-back with exact chunk highlighting.

     Two engines (2026-09-05, after a silent-playback debugging session):
     * media (DEFAULT): one hidden <audio> element chained block to block.
       Works everywhere <audio> works -- chosen because a browser was found
       where Web Audio output is silent while media elements play fine
       (typically an extension hooking AudioContext).
     * ?engine=webaudio: gapless Web Audio scheduling (AudioBuffer chain on a
       virtual timeline). Nicer transitions; kept for browsers where it works.

     Add ?selftest=1 to run the built-in audio-path diagnostics overlay. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%% — live</title>
<style>
  :root {
    color-scheme: light dark;
    --fs: 18px;
    --maxw: 900px;
    --toc-w: 260px;
    --bg: #faf9f7; --fg: #222; --section-label: #8a8a8a;
    --bar-bg: color-mix(in srgb, CanvasText 5%, transparent);
    --bar-hover: color-mix(in srgb, CanvasText 12%, transparent);
    --bar-border: color-mix(in srgb, CanvasText 18%, transparent);
    --accent: #2f7d4f;
  }
  * { box-sizing: border-box; }
  body {
    font: var(--fs)/1.7 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--bg); color: var(--fg);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --fg: #e6e6e6; --section-label: #9aa3b2;
      --bar-bg: #2a2d34; --bar-hover: #34373f; --bar-border: #3a3d44;
      --accent: #5ecb8a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --fg: #e6e6e6; --section-label: #9aa3b2;
    --bar-bg: #2a2d34; --bar-hover: #34373f; --bar-border: #3a3d44;
    --accent: #5ecb8a;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(8px);
    background: color-mix(in srgb, Canvas 82%, transparent);
    border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
    padding: 12px 20px;
  }
  header h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; opacity: .8; }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    font-size: 13px;
  }
  .bar button, .bar select {
    font: inherit; padding: 4px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--bar-border);
    background: var(--bar-bg); color: inherit;
  }
  .bar button:hover { background: var(--bar-hover); }
  .bar button.primary { border-color: var(--accent); font-weight: 600; }
  .bar label { display: inline-flex; align-items: center; gap: 5px; opacity: .85; }
  .bar .spacer { flex: 1; }
  .bar #clock { font-variant-numeric: tabular-nums; opacity: .7; }
  #seek { flex: 1 1 140px; min-width: 110px; accent-color: var(--accent); }
  #status {
    font-variant-numeric: tabular-nums; opacity: .8; white-space: nowrap;
  }
  #status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); margin-right: 4px; vertical-align: 1px;
  }
  #status.waiting .dot { background: #d9a441; animation: pulse 1.2s infinite; }
  #status.error .dot { background: #c0453e; }
  @keyframes pulse { 50% { opacity: .35; } }
  #toc {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--toc-w);
    overflow-y: auto; z-index: 30;
    background: var(--bar-bg); border-right: 1px solid var(--bar-border);
    padding: calc(14px + env(safe-area-inset-top, 0px)) 14px 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-100%); transition: transform .18s ease;
  }
  body.toc-open #toc { transform: translateX(0); }
  #toc h2 { font-size: .72em; text-transform: uppercase; letter-spacing: .08em;
    color: var(--section-label); margin: 0 0 10px; }
  #toc ul { list-style: none; margin: 0; padding: 0; }
  #toc li { margin: 1px 0; }
  #toc a { display: block; padding: 5px 9px; border-radius: 6px; font-size: .86em;
    line-height: 1.3; color: inherit; text-decoration: none; opacity: .8; cursor: pointer; }
  #toc a:hover { background: var(--bar-hover); opacity: 1; }
  #toc a.active { background: #ffd34d; color: #1a1a1a; opacity: 1; font-weight: 600; }
  #toc a[data-level="1"], #toc a[data-level="2"] { font-weight: 700; opacity: .92; }
  #toc a[data-level="3"] { padding-left: 22px; font-weight: 400; opacity: .8; }
  #toc a[data-level="4"] { padding-left: 36px; font-weight: 400; opacity: .72; font-size: .95em; }
  #toc a[data-level="5"], #toc a[data-level="6"] {
    padding-left: 50px; font-weight: 400; opacity: .65; font-size: .92em; }
  #toc a[data-level].active { font-weight: 700; opacity: 1; }
  @media (max-width: 860px) {
    #toc { box-shadow: 2px 0 20px rgba(0,0,0,.3); }
  }
  @media (min-width: 861px) {
    body.toc-open { padding-left: var(--toc-w); }
  }
  main { max-width: var(--maxw); margin: 0 auto; padding: 28px 20px 50vh; }
  .seg { cursor: pointer; border-radius: 4px; transition: background .12s, color .12s; padding: 1px 2px; }
  .seg:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
  h2.seg { font-size: 1.35em; margin: 1.4em 0 .5em; display: block; }
  .section-label {
    font-size: .67em; text-transform: uppercase; letter-spacing: .08em;
    color: var(--section-label); margin: 1.6em 0 .4em; font-weight: 600;
  }
  .seg.active { background: #ffd34d; color: #1a1a1a; box-shadow: 0 0 0 2px #ffd34d; }
  .seg.past { opacity: .55; }
  #pending {
    color: var(--section-label); font-style: italic; padding: 26px 0;
    text-align: center;
  }
  #pending .spin {
    display: inline-block; animation: rot 1.4s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>%%TITLE%%</h1>
  <div class="bar">
    <button id="toctoggle" title="Contents (T)">☰ Contents</button>
    <button id="playbtn" class="primary" title="Play/Pause (Space)">▶ Play</button>
    <button data-skip="-10" title="Back 10s (←)">« 10s</button>
    <button data-skip="10" title="Forward 10s (→)">10s »</button>
    <input type="range" id="seek" min="0" max="1000" value="0" title="Seek">
    <label>Speed
      <select id="speed" title="Playback speed ( [ and ] )">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <label><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
    <button id="fontminus" title="Smaller text">A−</button>
    <button id="fontplus" title="Larger text">A+</button>
    <label>Width
      <select id="width" title="Reading column width">
        <option value="640px">Narrow</option>
        <option value="900px" selected>Comfortable</option>
        <option value="1200px">Wide</option>
        <option value="none">Full width</option>
      </select>
    </label>
    <button id="themetoggle" title="Toggle light/dark theme">🌓</button>
    <span class="spacer"></span>
    <span id="status" class="waiting"><span class="dot"></span><span id="statustext">connecting…</span></span>
    <span id="clock">0:00 / 0:00</span>
  </div>
</header>
<nav id="toc" aria-label="Contents">
  <h2>Contents</h2>
  <ul id="toclist"></ul>
</nav>
<main id="transcript">
  <div id="pending"><span class="spin">◌</span>&nbsp; waiting for the first blocks…</div>
</main>
<script>
"use strict";
const JOB = "%%JOB_ID%%";
const $ = id => document.getElementById(id);
const ENGINE = new URLSearchParams(location.search).get("engine") === "webaudio"
  ? "webaudio" : "media";

// --- ?selftest: diagnostics overlay for the audio path -----------------
// Media-engine probe runs by default; a Web Audio graph probe runs when the
// engine is webaudio (or with &probe=webaudio). The audible part needs one
// click on the page (autoplay policy) -- the overlay says so.
if (new URLSearchParams(location.search).has("selftest")) {
  (async () => {
    const lines = [];
    const log = (...a) => {
      const s = a.join(" ");
      lines.push(s); console.log("[selftest]", s);
      let d = document.getElementById("selftest");
      if (!d) {
        d = document.createElement("pre"); d.id = "selftest";
        d.style.cssText = "position:fixed;top:0;left:0;z-index:99;background:#000;" +
          "color:#0f0;font:12px monospace;padding:8px;white-space:pre-wrap;";
        document.body && document.body.appendChild(d);
      }
      d.textContent = lines.join("\n") + "\n";
    };
    try {
      log("engine:", ENGINE, "job:", JOB);
      const r = await fetch(`/block/${JOB}/1`);
      log("fetch block 1:", r.status, r.headers.get("content-type"));
      // --- media-element path (the default engine) ---
      const a = document.createElement("audio");
      a.preload = "auto";
      a.src = `/block/${JOB}/1`;
      await new Promise((res, rej) => {
        a.addEventListener("loadedmetadata", res, { once: true });
        a.addEventListener("error", () => rej(new Error("element error " + (a.error ? a.error.code : "?"))), { once: true });
        setTimeout(() => rej(new Error("metadata timeout (8s)")), 8000);
      });
      log("media: metadata ok,", a.duration.toFixed(2) + "s",
          a.readyState, "readyState");
      const tryPlay = () => a.play().then(
        () => log("media: play() ok -- LISTEN: you should hear ~6s now " +
                  "(t=" + a.currentTime.toFixed(2) + ")"),
        e => log("media: play() REJECTED:", e.name,
                 "-- click the page once and it will retry"));
      const onClick = () => { tryPlay(); document.removeEventListener("pointerdown", onClick); };
      document.addEventListener("pointerdown", onClick);
      await tryPlay().catch(() => {});
      setTimeout(() => log("media: t=" + a.currentTime.toFixed(2),
                           a.paused ? "PAUSED" : "PLAYING",
                           a.paused ? "(no gesture yet? click anywhere)" : "-- audibility check: do you HEAR it?"),
                 1500);
      // --- Web Audio graph probe (informational / webaudio engine) ---
      if (ENGINE === "webaudio" || new URLSearchParams(location.search).has("probe")) {
        const c = new (window.AudioContext || window.webkitAudioContext)();
        log("webaudio: ctx", c.state, c.sampleRate + "Hz");
        await c.resume().catch(e => log("webaudio: resume threw", e.name));
        log("webaudio: state after resume:", c.state);
        const ab = await (await fetch(`/block/${JOB}/1`)).arrayBuffer();
        const buf = await new Promise((res, rej) => c.decodeAudioData(ab, res, rej));
        log("webaudio: decoded", buf.duration.toFixed(2) + "s", buf.numberOfChannels + "ch");
        const src = c.createBufferSource(); src.buffer = buf;
        const an = c.createAnalyser(); src.connect(an); an.connect(c.destination);
        src.start();
        setTimeout(() => {
          const d2 = new Uint8Array(an.fftSize);
          an.getByteTimeDomainData(d2);
          let peak = 0; for (const v of d2) peak = Math.max(peak, Math.abs(v - 128));
          log("webaudio: analyser peak:", peak, peak > 1 ? "SIGNAL PRESENT (graph ok; if you hear nothing while media above is audible, Web Audio output is broken in this browser)" : "FLAT");
        }, 800);
      }
      log("SELFTEST COMPLETE (media probe lines above; hear-check is on you)");
    } catch (e) {
      log("SELFTEST FAIL:", (e && e.message) || String(e));
    }
  })();
}

const transcript = $("transcript"), pendingEl = $("pending");

// ---------- table of contents, built incrementally as headers arrive ----------
const tocToggle = $("toctoggle"), tocList = $("toclist");
let headerBoundaries = [];  // segEls index at which each header starts
let tocLinks = [];
let activeHeaderIdx = -1;
function setTocOpen(open) { document.body.classList.toggle("toc-open", open); }
setTocOpen(innerWidth > 860);
tocToggle.addEventListener("click", () => setTocOpen(!document.body.classList.contains("toc-open")));
function addTocEntry(text, level, v0) {
  headerBoundaries.push(segEls.length);  // the header's own segEl is pushed right after this call
  const a = document.createElement("a");
  a.textContent = text;
  a.href = "#";
  if (level) a.dataset.level = level;
  a.addEventListener("click", (e) => {
    e.preventDefault();
    playFrom(v0 + 0.001);
    if (innerWidth <= 860) setTocOpen(false);
  });
  const li = document.createElement("li");
  li.appendChild(a);
  tocList.appendChild(li);
  tocLinks.push(a);
}
function updateTocActive(i) {
  if (!headerBoundaries.length) return;
  let hi = -1;
  for (let k = 0; k < headerBoundaries.length; k++) {
    if (headerBoundaries[k] <= i) hi = k; else break;
  }
  if (hi === activeHeaderIdx) return;
  if (activeHeaderIdx >= 0 && tocLinks[activeHeaderIdx]) tocLinks[activeHeaderIdx].classList.remove("active");
  activeHeaderIdx = hi;
  if (hi >= 0 && tocLinks[hi]) {
    tocLinks[hi].classList.add("active");
    tocLinks[hi].scrollIntoView({ block: "nearest" });
  }
}

// ---------- model (from /manifest) ----------
let model = [];        // block entries in play order: {i, wav, duration_ms, label, section, chunks[]}
let offsets = [0];     // offsets[p] = virtual seconds at which model[p] starts
let narrated = 0;      // blocks expected this run (0 until extract finishes)
let jobDone = false, jobDead = null;  // dead: "error"/"cancelled"
let rendered = 0;      // blocks already in the DOM
let segEls = [];       // chunk spans, in virtual order

function recomputeOffsets() {
  offsets = [0];
  for (const b of model) offsets.push(offsets[offsets.length - 1] + b.duration_ms / 1000);
}
const totalVT = () => offsets[offsets.length - 1];
const clampV = v => Math.max(0, Math.min(v, totalVT()));
function posOf(v) {
  let p = 0;
  while (p + 1 < model.length && offsets[p + 1] <= v) p++;
  return p;
}

// ---------- shared playback state ----------
let rate = 1;
let started = false, playing = false, paused = false;
let pendingV = 0;      // position to use on first Play (after a cold seek)
let decodeErr = null;  // last error, surfaced in the status tooltip

// ---------- media engine (default) ----------
// One hidden <audio> element, chained block to block. Trades the Web Audio
// engine's gapless transitions for compatibility: it goes through the exact
// same path as a plain <audio src>, which every browser plays.
let ael = null, curPos = -1, awaitingNext = false, bookEnded = false, mediaBuffering = false;

function mediaEnsure() {
  if (ael) return ael;
  ael = document.createElement("audio");
  ael.preload = "auto";
  ael.addEventListener("timeupdate", () => updateUI(vtNow()));
  ael.addEventListener("waiting", () => { mediaBuffering = true; });
  ael.addEventListener("playing", () => { mediaBuffering = false; });
  ael.addEventListener("error", () => {
    const i = (model[curPos] || {}).i;
    decodeErr = `block ${i}: element error ${ael.error ? ael.error.code : "?"}`;
  });
  ael.addEventListener("ended", onBlockEnded);
  return ael;
}
function loadBlock(p, off) {
  const e = model[p];
  if (!e) return;
  awaitingNext = false; bookEnded = false;
  curPos = p;
  started = true; playing = true; paused = false;
  $("playbtn").textContent = "⏸ Pause";
  ael.src = `/block/${JOB}/${e.i}`;
  ael.addEventListener("loadedmetadata", () => {
    if (off > 0) { try { ael.currentTime = off; } catch (err) {} }
    ael.playbackRate = rate;
    ael.play().catch(() => {});
  }, { once: true });
  ael.load();
}
function onBlockEnded() {
  if (curPos + 1 < model.length) loadBlock(curPos + 1, 0);
  else if (jobDone) {
    playing = false; bookEnded = true;
    $("playbtn").textContent = "↻ Replay";
  } else {
    awaitingNext = true;  // tick() continues when synthesis delivers
  }
}
function mediaPlayFrom(v) {
  v = clampV(v);
  mediaEnsure();
  const p = posOf(v);
  loadBlock(p, v - offsets[p]);
}
function mediaVT() {
  return (curPos < 0 || !ael) ? pendingV : Math.min(offsets[curPos] + ael.currentTime, totalVT());
}

// ---------- webaudio engine (?engine=webaudio) ----------
// Gapless AudioBuffer chain on a virtual timeline: vt = virtualBase +
// (ctx.currentTime - ctxBase) * rate. Sources are scheduled at their exact
// virtual times; a late (stalled) block re-anchors the timeline at now.
let ctx = null;            // AudioContext
let bufs = new Map();      // block.i -> AudioBuffer
let inflight = new Set();  // block.i with a fetch in flight (tick overlap dedup)
let rawBlobs = new Map();  // block.i -> ArrayBuffer awaiting a RUNNING ctx
let fetchFailed = new Map(); // block.i -> timestamp (retry backoff)
let virtualBase = 0, ctxBase = 0;
let nextPos = 0, nextVT = 0;
let sched = [];
let stalled = false;

function ensureCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  return ctx;
}
const waVT = () => started
  ? virtualBase + (ctx.currentTime - ctxBase) * rate
  : pendingV;
const ctxTimeFor = v => ctxBase + (v - virtualBase) / rate;

function stopSources() {
  for (const s of sched) { try { s.onended = null; s.stop(); } catch (e) {} }
  sched = [];
}
function waStart(v) {
  v = clampV(v);
  stopSources();
  const p = posOf(v);
  nextPos = p;
  nextVT = Math.max(v, offsets[p]);
  virtualBase = nextVT;
  ctxBase = ctx.currentTime + 0.08;
  started = true; playing = true; paused = false;
  $("playbtn").textContent = "⏸ Pause";
  waTick();
}
function waPause() { playing = false; paused = true; ctx.suspend(); $("playbtn").textContent = "▶ Play"; }
function waResume() { ctx.resume(); playing = true; paused = false; $("playbtn").textContent = "⏸ Pause"; }

function decodeBlob(i, ab) {
  return new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej))
    .then(buf => {
      if (!buf || !buf.duration) throw new Error("empty decode result");
      bufs.set(i, buf);
      waTick();
    })
    .catch(e => {
      decodeErr = `block ${i}: ${e.message || e}`;
      console.error("block decode failed:", decodeErr);
      fetchFailed.set(i, Date.now());
    });
}
function drainRawBlobs() {
  if (!ctx || ctx.state !== "running" || rawBlobs.size === 0) return;
  const pend = [...rawBlobs];
  rawBlobs.clear();
  for (const [i, ab] of pend) decodeBlob(i, ab);
}
function fetchBlock(pos) {
  const entry = model[pos];
  if (!entry || bufs.has(entry.i) || inflight.has(entry.i)
      || rawBlobs.has(entry.i)) return;
  const fail = fetchFailed.get(entry.i);
  if (fail && Date.now() - fail < 2000) return;
  ensureCtx();
  inflight.add(entry.i);
  fetch(`/block/${JOB}/${entry.i}`)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); })
    .then(ab => {
      // Safari: decodeAudioData on a suspended context never calls back --
      // stash the bytes, decode once running (drainRawBlobs from waTick).
      if (ctx.state !== "running") { rawBlobs.set(entry.i, ab); return; }
      return decodeBlob(entry.i, ab);
    })
    .catch(e => {
      decodeErr = `block ${entry.i}: ${e.message || e}`;
      console.error("block fetch failed:", decodeErr);
      fetchFailed.set(entry.i, Date.now());
    })
    .finally(() => inflight.delete(entry.i));
}
function waTick() {
  drainRawBlobs();
  const base = started ? nextPos : posOf(vtNow());
  for (let p = base; p < Math.min(model.length, base + 4); p++) fetchBlock(p);

  stalled = false;
  while (playing && ctx && ctx.state === "running" &&
         nextPos < model.length && bufs.has(model[nextPos].i)) {
    let t0 = ctxTimeFor(nextVT);
    if (t0 < ctx.currentTime + 0.01) {   // late: re-anchor at now
      virtualBase = nextVT;
      ctxBase = ctx.currentTime + 0.05;
      t0 = ctxBase;
    }
    const buf = bufs.get(model[nextPos].i);
    const off = Math.max(0, nextVT - offsets[nextPos]);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate;
    src.start(t0, off);
    sched.push(src);
    nextVT += (buf.duration - off) / rate;
    nextPos++;
  }
  if (playing && nextPos < model.length && ctxTimeFor(nextVT) <= ctx.currentTime + 0.05)
    stalled = true;

  if (started && playing && nextPos >= model.length && vtNow() >= totalVT() - 0.01) {
    if (jobDone) {
      stopSources(); playing = false; bookEnded = true;
      $("playbtn").textContent = "↻ Replay";
    } else {
      virtualBase = totalVT(); ctxBase = ctx.currentTime;  // pin at frontier
    }
  }
  updateUI(vtNow());
}

// ---------- engine dispatch ----------
const vtNow = () => ENGINE === "media" ? mediaVT() : (started && ctx ? waVT() : pendingV);

function playFrom(v) {
  if (ENGINE === "media") mediaPlayFrom(v);
  else ensureCtx().resume().then(() => waStart(v))
    .catch(e => { decodeErr = "resume failed: " + (e.message || e); updateUI(vtNow()); });
}
function seekTo(v, { play = null } = {}) {
  v = clampV(v);
  const wantPlay = play === null ? (playing || paused || started) : play;
  if (wantPlay && model.length) {
    playFrom(v);
  } else {
    if (ENGINE === "webaudio") stopSources();
    started = false; playing = false; paused = false;
    pendingV = v;
    $("playbtn").textContent = "▶ Play";
    updateUI(v);
  }
}
function onPlayBtn() {
  if (playing) {
    if (ENGINE === "media") { ael.pause(); playing = false; paused = true; $("playbtn").textContent = "▶ Play"; }
    else waPause();
    updateUI(vtNow());
  } else if (paused && !bookEnded && !(ENGINE === "media" && awaitingNext)) {
    if (ENGINE === "media") { ael.play().catch(() => {}); playing = true; paused = false; $("playbtn").textContent = "⏸ Pause"; }
    else waResume();
  } else {
    playFrom(bookEnded ? 0 : vtNow());
    if (ENGINE === "webaudio") setTimeout(() => {   // autoplay watchdog
      if (!started && ctx && ctx.state !== "running") {
        decodeErr = "audio blocked by browser -- click Play again";
        updateUI(vtNow());
      }
    }, 500);
  }
}
$("playbtn").onclick = onPlayBtn;

// ---------- rendering ----------
function renderNew() {
  const frag = document.createDocumentFragment();
  let lastSection = null;
  if (rendered > 0 && model[rendered - 1]) lastSection = model[rendered - 1].section;
  for (let p = rendered; p < model.length; p++) {
    const b = model[p], base = offsets[p];
    for (const ch of b.chunks) {
      const v0 = base + ch.start_ms / 1000, v1 = base + ch.end_ms / 1000;
      if (b.label === "header") {
        const el = document.createElement("h2");
        el.className = "seg";
        el.dataset.v0 = v0; el.dataset.v1 = v1;
        el.textContent = ch.text;
        addTocEntry(ch.text, ch.level, v0);
        frag.appendChild(el); segEls.push(el);
        lastSection = ch.text;
      } else {
        if (b.section && b.section !== lastSection) {
          const sl = document.createElement("div");
          sl.className = "section-label";
          sl.textContent = b.section;
          frag.appendChild(sl);
          lastSection = b.section;
        }
        const el = document.createElement("span");
        el.className = "seg";
        el.dataset.v0 = v0; el.dataset.v1 = v1;
        el.textContent = ch.text + " ";
        frag.appendChild(el); segEls.push(el);
      }
    }
  }
  rendered = model.length;
  transcript.insertBefore(frag, pendingEl);
  for (const el of segEls) {
    if (!el._bound) { el._bound = true; el.addEventListener("click", () => playFrom(+el.dataset.v0 + 0.001)); }
  }
}

// ---------- highlight + UI ----------
let active = -1;
function findSeg(t) {
  let lo = 0, hi = segEls.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (t < +segEls[mid].dataset.v0) hi = mid - 1;
    else if (t >= +segEls[mid].dataset.v1) lo = mid + 1;
    else { ans = mid; break; }
  }
  return ans;
}
function setActive(i) {
  if (i === active) return;
  if (active >= 0 && segEls[active]) segEls[active].classList.remove("active");
  active = i;
  updateTocActive(i);
  if (i < 0) return;
  const el = segEls[i];
  if (!el) return;
  el.classList.add("active");
  for (let k = 0; k < segEls.length; k++) segEls[k].classList.toggle("past", k < i);
  if ($("autoscroll").checked && (playing || paused)) {
    const r = el.getBoundingClientRect();
    if (r.top < 100 || r.bottom > innerHeight - 60)
      el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}
const fmt = s => (s < 0 || isNaN(s)) ? "0:00"
  : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

function updateUI(v) {
  const total = totalVT();
  $("clock").textContent = fmt(v) + " / " + (jobDone ? fmt(total) : (total > 0 ? fmt(total) + "+" : "—"));
  if (total > 0) $("seek").value = Math.round(1000 * clampV(v) / total);
  setActive(findSeg(v));

  const st = $("status"), tx = $("statustext");
  if (jobDead) {
    st.className = "error";
    tx.textContent = jobDead === "cancelled" ? "job cancelled" : "job failed";
  } else if (playing && awaitingNext && !jobDone) {
    st.className = "waiting";
    tx.textContent = "caught up — synthesizing more…";
  } else if (playing && mediaBuffering) {
    st.className = "waiting";
    tx.textContent = "buffering…";
  } else if (playing && ENGINE === "webaudio" && stalled) {
    st.className = "waiting";
    tx.textContent = "buffering block " + (nextPos + 1) + "…";
  } else if (playing) {
    st.className = "";
    const n = model.length;
    tx.textContent = "streaming " + (narrated ? Math.min(n, narrated) + "/" + narrated : n + " blocks")
      + (ENGINE === "media" ? "" : " · webaudio");
  } else if (!started) {
    st.className = "waiting";
    const n = model.length;
    tx.textContent = n === 0 ? "waiting for first block…"
      : "ready — " + n + (narrated ? "/" + narrated : "") + " blocks";
  } else { // paused / ended
    st.className = "waiting";
    tx.textContent = bookEnded ? "complete — " + fmt(total) : "paused";
  }
  if (jobDone && model.length && rendered === model.length && pendingEl.parentNode)
    pendingEl.remove();
  else if (!jobDone && pendingEl.parentNode && model.length)
    pendingEl.firstElementChild.nextSibling.textContent =
      "  synthesizing — " + model.length + (narrated ? "/" + narrated : "") + " blocks ready";

  // Diagnostics in the tooltip (hover the status pill).
  st.title = "engine: " + ENGINE
    + (ENGINE === "webaudio" ? (ctx ? " · audio: " + ctx.state : " · audio: not started")
       + " · decoded " + bufs.size + "/" + model.length
       + (rawBlobs.size ? " · held " + rawBlobs.size + " for running ctx" : "")
       + (started ? " · next block #" + (nextPos + 1) : "")
       : (ael ? " · element readyState " + ael.readyState
              + " · network " + ael.networkState : " · element not created"))
    + (decodeErr ? " · last error: " + decodeErr : "");
}

// ---------- manifest polling ----------
let pollTimer = null;
async function poll() {
  try {
    const r = await fetch(`/manifest/${JOB}`);
    if (!r.ok) throw new Error(r.status);
    const m = await r.json();
    jobDone = m.status === "done";
    if (m.status === "error" || m.status === "cancelled") jobDead = m.status;
    narrated = m.narrated || 0;
    const fresh = m.blocks || [];
    if (fresh.length > model.length) {
      model = fresh;
      recomputeOffsets();
      renderNew();
    }
    updateUI(vtNow());
    if (jobDone && model.length >= Math.max(narrated, 1)) return;
    if (jobDead) return;
  } catch (e) { /* transient -- retry below */ }
  pollTimer = setTimeout(poll, 1500);
}
poll();

// master 200ms loop: media engine continuation + webaudio scheduling
setInterval(() => {
  if (ENGINE === "media") {
    if (playing && awaitingNext && curPos + 1 < model.length) loadBlock(curPos + 1, 0);
    updateUI(vtNow());
  } else {
    waTick();
  }
}, 200);

// ---------- controls ----------
$("seek").addEventListener("input", () => {
  const total = totalVT();
  if (total > 0) seekTo(+$("seek").value / 1000 * total);
});
document.querySelectorAll("[data-skip]").forEach(b =>
  b.addEventListener("click", () => seekTo(vtNow() + (+b.dataset.skip))));
$("speed").addEventListener("change", () => {
  rate = +$("speed").value;
  if (ENGINE === "media") { if (ael) ael.playbackRate = rate; }
  else if (playing) { ctx.resume().then(() => waStart(vtNow())); }
  else if (started || paused) {
    stopSources(); started = false; paused = false; pendingV = vtNow();
    $("playbtn").textContent = "▶ Play";
  }
  updateUI(vtNow());
});
let fs = 18;
const setFs = d => { fs = Math.max(12, Math.min(30, fs + d));
  document.documentElement.style.setProperty("--fs", fs + "px"); };
$("fontplus").addEventListener("click", () => setFs(2));
$("fontminus").addEventListener("click", () => setFs(-2));
$("width").addEventListener("change", () =>
  document.documentElement.style.setProperty("--maxw", $("width").value));

// --- light/dark theme toggle ---
const themeBtn = $("themetoggle");
function systemTheme() {
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.documentElement.style.colorScheme = t;
  themeBtn.textContent = t === "dark" ? "🌙" : "☀️";
}
applyTheme(systemTheme());
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

// --- keyboard shortcuts ---
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
function bumpSpeed(dir) {
  let i = SPEEDS.indexOf(+$("speed").value);
  i = Math.max(0, Math.min(SPEEDS.length - 1, (i < 0 ? 2 : i) + dir));
  $("speed").value = SPEEDS[i];
  $("speed").dispatchEvent(new Event("change"));
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); onPlayBtn(); }
  else if (e.key === "ArrowLeft")  { seekTo(vtNow() - 10); }
  else if (e.key === "ArrowRight") { seekTo(vtNow() + 10); }
  else if (e.key === "[") bumpSpeed(-1);
  else if (e.key === "]") bumpSpeed(1);
  else if (e.key === "t" || e.key === "T") { setTocOpen(!document.body.classList.contains("toc-open")); }
});
</script>
</body>
